services:
  postgres:
    image: postgres:16-alpine
    container_name: issue-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issue_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-issue_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - issue-management-net

  redis:
    image: redis:7.4-alpine
    container_name: issue-management-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - issue-management-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_local
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c '</dev/tcp/127.0.0.1/6334' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - issue-management-net

volumes:
  postgres_data:
    name: issue-management-postgres-data
  redis_data:
    name: issue-management-redis-data
  qdrant_data:
    name: issue-management-qdrant-data

networks:
  issue-management-net:
    name: issue-management-net
    driver: bridge
