spring.application.name=issueManagement-test

# In-Memory H2 Database Configuration for Tests (Isolated from production PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Security JWT
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-ms=86400000
security.jwt.issuer=ai-issue-management-test

# Gemini test configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:test-api-key}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:test-api-key}

# Redis test configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Assistant test configuration
assistant.memory.max-messages-per-conversation=30
assistant.memory.conversation-ttl-seconds=86400
assistant.memory.max-user-message-length=4000
assistant.semantic-cache.enabled=true
assistant.semantic-cache.ttl-seconds=3600
assistant.semantic-cache.similarity-threshold=0.88
assistant.semantic-cache.max-candidates=20


