spring.application.name=issueManagement

# Server Configuration
server.port=8080

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Springdoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Security & JWT Configuration
# 256-bit secret key in base64/hex (Default for dev, override with JWT_SECRET in production)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
security.jwt.issuer=ai-issue-management

# ==========================================
# GEMINI (Spring AI Google GenAI)
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_EMBEDDING_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL}
spring.ai.google.genai.embedding.text.dimensions=3072
spring.ai.google.genai.embedding.dimensions=3072
# ==========================================
# QDRANT
# ==========================================
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT}
spring.ai.vectorstore.qdrant.collection-name=issues
spring.ai.vectorstore.qdrant.initialize-schema=true

# ==========================================
# REDIS (Conversation Memory & Semantic Cache)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000ms}

# ==========================================
# ASSISTANT CONFIGURATION
# ==========================================
assistant.memory.max-messages-per-conversation=${ASSISTANT_MAX_MESSAGES:30}
assistant.memory.conversation-ttl-seconds=${ASSISTANT_CONVERSATION_TTL_SECONDS:86400}
assistant.memory.max-user-message-length=${ASSISTANT_MAX_USER_MESSAGE_LENGTH:4000}
assistant.memory.max-retrieved-items=${ASSISTANT_MAX_RETRIEVED_ITEMS:10}

# ==========================================
# SEMANTIC CACHE CONFIGURATION
# ==========================================
assistant.semantic-cache.enabled=${ASSISTANT_SEMANTIC_CACHE_ENABLED:true}
assistant.semantic-cache.ttl-seconds=${ASSISTANT_SEMANTIC_CACHE_TTL_SECONDS:3600}
assistant.semantic-cache.similarity-threshold=${ASSISTANT_SEMANTIC_CACHE_THRESHOLD:0.88}
assistant.semantic-cache.max-candidates=${ASSISTANT_SEMANTIC_CACHE_MAX_CANDIDATES:20}

