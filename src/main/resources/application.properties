spring.application.name=issueManagement

# Server Configuration & Graceful Shutdown (Compatible with Render $PORT)
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# PostgreSQL Datasource Configuration (Compatible with Neon SSL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (Optimized for Neon Serverless PostgreSQL)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME:120000}
spring.datasource.hikari.pool-name=IssueManagementHikariCP

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Springdoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Security & JWT Configuration
# 256-bit secret key in base64/hex (Default for dev, override with JWT_SECRET in production)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
security.jwt.issuer=ai-issue-management

# ==========================================
# GEMINI (Spring AI Google GenAI)
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_EMBEDDING_KEY:${GEMINI_API_KEY}}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
spring.ai.google.genai.embedding.text.dimensions=3072
spring.ai.google.genai.embedding.dimensions=3072

# ==========================================
# QDRANT (Qdrant Cloud & Vector Store)
# ==========================================
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:issues}
spring.ai.vectorstore.qdrant.initialize-schema=true

# ==========================================
# REDIS (Upstash Redis & Semantic Cache)
# ==========================================
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000ms}

# ==========================================
# ASSISTANT CONFIGURATION
# ==========================================
assistant.memory.max-messages-per-conversation=${ASSISTANT_MAX_MESSAGES:30}
assistant.memory.conversation-ttl-seconds=${ASSISTANT_CONVERSATION_TTL_SECONDS:86400}
assistant.memory.max-user-message-length=${ASSISTANT_MAX_USER_MESSAGE_LENGTH:4000}
assistant.memory.max-retrieved-items=${ASSISTANT_MAX_RETRIEVED_ITEMS:10}

# ==========================================
# SEMANTIC CACHE CONFIGURATION
# ==========================================
assistant.semantic-cache.enabled=${ASSISTANT_SEMANTIC_CACHE_ENABLED:true}
assistant.semantic-cache.ttl-seconds=${ASSISTANT_SEMANTIC_CACHE_TTL_SECONDS:3600}
assistant.semantic-cache.similarity-threshold=${ASSISTANT_SEMANTIC_CACHE_THRESHOLD:0.88}
assistant.semantic-cache.max-candidates=${ASSISTANT_SEMANTIC_CACHE_MAX_CANDIDATES:20}

# ==========================================
# SPRING BOOT ACTUATOR & OBSERVABILITY
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ==========================================
# CORS CONFIGURATION
# ==========================================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80}

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

